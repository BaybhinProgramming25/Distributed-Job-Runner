name: Deploy to DigitalOcean Instance

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "."
          target: "~/Distributed-Job-Runner"

      - name: Create root .env
        uses: appleboy/ssh-action@v1.0.3
        with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SERVER_SSH_KEY }}
            script: |
              cat > ~/Distributed-Job-Runner/.env << 'EOF'
              SITE_ADDRESS=${{ secrets.SITE_ADDRESS }}
              WWW_ADDRESS=www.${{ secrets.SITE_ADDRESS }}
              APP_ALLOWED_ORIGIN=https://${{ secrets.SITE_ADDRESS }}
              APP_JWT_SECRET=${{ secrets.APP_JWT_SECRET }}
              EOF

      - name: Deploy on cloud server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/Distributed-Job-Runner
            docker compose up -d --build --remove-orphans
            docker image prune -f
