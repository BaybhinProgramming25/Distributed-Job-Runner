services:
  cockroachdb:
    image: cockroachdb/cockroach:latest
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8081:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
      - ./schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_HOST: cockroachdb
      RABBITMQ_HOST: rabbitmq
      APP_JWT_SECRET: ${APP_JWT_SECRET}
    ports:
      - "7000:7000"
    depends_on:
      cockroachdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  scheduler:
    build: ./scheduler
    environment:
      DB_HOST: cockroachdb
      RABBITMQ_HOST: rabbitmq
    depends_on:
      cockroachdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  
  worker:
    build: ./worker
    environment:
      DB_HOST: cockroachdb
      RABBITMQ_HOST: rabbitmq
    depends_on:
      cockroachdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 5
    
volumes:
  cockroach-data: